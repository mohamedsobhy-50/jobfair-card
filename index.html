
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101d30">
  <meta name="description" content="Mohamed Alkazaz | Data Analyst">
  <title>Mohamed Alkazaz | Professional Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #101a29;
      --card: #18283b;
      --card-light: #20354b;
      --blue: #4c9de0;
      --teal: #50b9ad;
      --text: #f4f7fb;
      --muted: #a8b8ca;
      --border: rgba(184, 204, 226, .14);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px 18px;
      overflow-x: hidden;

      background:
        radial-gradient(
          ellipse at 50% 0%,
          rgba(49, 112, 164, .22),
          transparent 52%
        ),
        linear-gradient(145deg, #0d1725, #13243a 55%, #0d1725);

      color: var(--text);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: min(100%, 510px);
      animation: appear .7s ease both;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 39px 34px 27px;

      border: 1px solid var(--border);
      border-radius: 23px;

      background: linear-gradient(
        150deg,
        rgba(29, 48, 70, .98),
        rgba(20, 35, 53, .99)
      );

      box-shadow:
        0 28px 80px rgba(0, 0, 0, .32),
        inset 0 1px 0 rgba(255, 255, 255, .035);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      width: 76%;
      height: 2px;

      background: linear-gradient(
        90deg,
        transparent,
        var(--blue),
        var(--teal),
        transparent
      );

      opacity: .8;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 42px;
    }

    .logo {
      width: 47px;
      height: 47px;
      flex-shrink: 0;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background: linear-gradient(145deg, #6db8ec, #3885c3);
      color: #10243a;

      font-family: "Manrope", sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -1px;

      box-shadow: 0 5px 22px rgba(76, 157, 224, .17);
    }

    .eyebrow {
      color: #9db5cc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.2px;
      text-transform: uppercase;
    }

    h1 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(30px, 7vw, 38px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -1.5px;
      color: #f5f8fc;
    }

    .role {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 15px;

      color: #b9d0e5;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .4px;
    }

    .role::before {
      content: "";
      width: 25px;
      height: 2px;
      flex-shrink: 0;
      border-radius: 5px;
      background: var(--teal);
    }

    .divider {
      height: 1px;
      margin: 31px 0 27px;

      background: linear-gradient(
        90deg,
        rgba(76, 157, 224, .7),
        rgba(80, 185, 173, .18) 70%,
        transparent
      );
    }

    .section-title {
      margin-bottom: 16px;
      color: #9db5cc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      min-height: 77px;
      padding: 14px 16px;

      display: flex;
      align-items: center;
      gap: 15px;

      border: 1px solid var(--border);
      border-radius: 15px;

      background: rgba(255, 255, 255, .025);
      color: inherit;
      text-decoration: none;

      transition: all .25s ease;
    }

    .link:hover {
      transform: translateY(-3px);
      border-color: rgba(76, 157, 224, .5);
      background: rgba(76, 157, 224, .065);
      box-shadow: 0 9px 25px rgba(0, 0, 0, .16);
    }

    .link:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 4px;
    }

    .icon {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;

      display: grid;
      place-items: center;

      border-radius: 12px;
      background: rgba(76, 157, 224, .12);
      color: #78b9ed;

      font-size: 19px;
      font-weight: 700;

      transition: background .25s ease;
    }

    .link:hover .icon {
      background: rgba(76, 157, 224, .2);
    }

    .link-content {
      flex: 1;
      min-width: 0;
    }

    .link-title {
      display: block;
      color: #f0f5fb;
      font-family: "Manrope", sans-serif;
      font-size: 14px;
      font-weight: 700;
    }

    .link-description {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.5;
    }

    .arrow {
      color: #829db7;
      font-size: 23px;
      line-height: 1;
      transition: all .25s ease;
    }

    .link:hover .arrow {
      color: var(--teal);
      transform: translateX(3px);
    }

    footer {
      margin-top: 28px;
      padding-top: 19px;

      border-top: 1px solid rgba(184, 204, 226, .09);

      text-align: center;
      color: #91a5ba;
      font-size: 11px;
      letter-spacing: .2px;
    }

    footer span {
      padding: 0 5px;
      color: var(--teal);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 22px 15px;
      }

      .card {
        padding: 31px 21px 23px;
        border-radius: 21px;
      }

      .top {
        margin-bottom: 36px;
      }

      .link {
        padding: 12px;
        gap: 12px;
      }

      .link-description {
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <section class="card">

      <div class="top">
        <div class="logo">MA</div>
        <div class="eyebrow">Professional Profile</div>
      </div>

      <h1>Mohamed Alkazaz</h1>

      <p class="role">Data Analyst</p>

      <div class="divider"></div>

      <p class="section-title">Explore My Profile</p>

      <nav class="links">

        <!-- CV -->
        <a class="link"
           href="https://drive.google.com/file/d/1F0sGcJTMOAyAd727DeJUnx192oMIiMf4/view"
           target="_blank"
           rel="noopener noreferrer">

          <span class="icon">📄</span>

          <span class="link-content">
            <span class="link-title">View My CV</span>
            <span class="link-description">
              Experience, skills &amp; certifications
            </span>
          </span>

          <span class="arrow">›</span>
        </a>

        <!-- LinkedIn -->
        <a class="link"
           href="https://www.linkedin.com/in/mohammed-el-kazaz"
           target="_blank"
           rel="noopener noreferrer">

          <span class="icon">in</span>

          <span class="link-content">
            <span class="link-title">LinkedIn Profile</span>
            <span class="link-description">
              Connect with me professionally
            </span>
          </span>

          <span class="arrow">›</span>
        </a>

        <!-- Infographic -->
        <a class="link"
           href="https://drive.google.com/file/d/1X0OLuHQxttxQzXdNZCWeS3mkd_gk96nZ/view"
           target="_blank"
           rel="noopener noreferrer">

          <span class="icon">▧</span>

          <span class="link-content">
            <span class="link-title">Professional Infographic</span>
            <span class="link-description">
              A visual overview of my profile &amp; capabilities
            </span>
          </span>

          <span class="arrow">›</span>
        </a>

      </nav>

      <footer>
        Thank you for your time <span>·</span> Let's connect
      </footer>

    </section>
  </main>

</body>
</html>
